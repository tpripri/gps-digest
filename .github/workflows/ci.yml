name: CI

# Les tests tournent sur chaque push et chaque pull request.
# Aucun secret n'est nécessaire : la suite est autonome et génère
# ses propres fichiers de test.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests
        run: npm test
