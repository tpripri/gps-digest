<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Favicon. Contrainte dominante : la lisibilité à 16 pixels, où tout détail
    disparaît. D'où trois formes seulement, épaisses et bien séparées.

    Le motif dit ce que fait l'outil : une trace irrégulière (le fichier brut)
    qui devient trois barres régulières (le résumé structuré).
  -->
  <rect width="32" height="32" rx="7" fill="#0b5d3f"/>
  <path d="M4 21 L8 13 L12 17 L16 8"
        fill="none" stroke="#7fe3b4" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="19" y="18" width="3.4" height="8" rx="1.3" fill="#fff"/>
  <rect x="24.3" y="13" width="3.4" height="13" rx="1.3" fill="#fff"/>
</svg>
